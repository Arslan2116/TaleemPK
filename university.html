<!-- Absolute paths: these pages are served from /university/<slug>, so relative
     src would 404 (resolving to /university/config.js etc.) -->
<script defer src="/config.js"></script>
<script defer src="/merit-formulas.js"></script>
<script defer src="/chat-widget.js"></script>
<link rel="stylesheet" href="/university.css?v=3">
</head>
<body>

<nav>
  <a href="/" class="nav-logo">🎓 Taleem<span>PK</span></a>
  <div class="nav-search-wrap">
    <input type="search" id="navSearch" placeholder="🔍 Search university…" autocomplete="off" onkeydown="if(event.key==='Enter')doNavSearch()">
    <div class="nav-sug" id="navSug"></div>
  </div>
  <div class="nav-actions">
    <button class="nav-search-toggle" id="mobileSearchToggle" aria-label="Search universities" onclick="toggleMobileSearch()">🔍</button>
    <a href="/" class="nav-btn" title="All Universities"><span class="full">← All</span><span class="short">←</span></a>
    <button class="nav-btn solid" id="authBtn" onclick="onAuthBtn()">Login</button>
  </div>
</nav>
<div class="mobile-search-bar" id="mobileSearchBar">
  <input type="search" id="mobileNavSearch" placeholder="Search university…" autocomplete="off" onkeydown="if(event.key==='Enter')doMobileNavSearch()" oninput="doMobileNavSuggest(this.value)">
  <div class="nav-sug" id="mobileNavSug"></div>
</div>

<div id="content"><div class="loading">Loading university…</div></div>

<!-- Mobile sticky action bar -->
<div id="mobileSticky" class="mobile-sticky" style="display:none;">
  <a id="msVisit" class="btn" href="#" target="_blank" rel="noopener" style="flex:1;">🌐 Visit Site</a>
  <button class="btn" onclick="shareUni()" style="flex:1;background:#25D366;color:#fff;border-color:#25D366;">📤 Share</button>
</div>

<footer>© <span id="yr"></span> TaleemPK · <a href="/">Compare Universities in Pakistan</a></footer>

<!-- Auth modal -->
<div class="ov" id="authOv" onclick="if(event.target===this)closeAuth()">
  <div class="auth">
    <button class="x" onclick="closeAuth()">×</button>
    <h3 id="aTitle">Welcome back 👋</h3>
    <p class="muted" id="aSub">Log in to write a review or ask a question.</p>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn" style="flex:1;background:var(--navy);color:#fff" id="tabL" onclick="aTab('login')">Login</button>
      <button class="btn" style="flex:1;background:var(--gray-200);color:var(--navy)" id="tabS" onclick="aTab('signup')">Sign Up</button>
    </div>
    <form onsubmit="event.preventDefault(); submitAuth();" autocomplete="on">
      <div id="nameWrap" style="display:none"><label for="aName">Name</label><input id="aName" name="name" placeholder="Your name" autocomplete="name" maxlength="80"></div>
      <label for="aEmail">Email</label><input id="aEmail" name="email" type="email" autocomplete="username" required maxlength="120">
      <label for="aPass">Password</label><input id="aPass" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="200">
      <button class="btn" style="width:100%;margin-top:16px" id="aBtn" type="submit">Login</button>
    </form>
    <div class="amsg" id="aMsg"></div>
  </div>
</div>

<script defer src="/university.js"></script>
<script>
  // Show mobile sticky bar after scrolling past the hero
  window.addEventListener('scroll', function() {
    var ms = document.getElementById('mobileSticky');
    if (!ms) return;
    var show = window.scrollY > 200;
    ms.classList.toggle('show', show);
    document.body.classList.toggle('has-sticky', show);
  }, { passive: true });

  function shareUni() {
    var name  = document.querySelector('h1') ? document.querySelector('h1').textContent.trim() : document.title;
    var url   = window.location.href;
    var meta  = document.getElementById('metaDesc');
    var desc  = meta ? meta.getAttribute('content') : '';
    var text  = '🎓 *' + name + '*\n\n' + desc.substring(0, 120) + '\n\n' + url + '\n\n_via TaleemPK — Pakistan\'s University Guide_';
    if (navigator.share) {
      navigator.share({ title: name, url: url }).catch(function() {
        window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
      });
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
  }
</script>
</body>
</html>
