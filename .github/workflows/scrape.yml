name: Scrape university updates

on:
  schedule:
    - cron: '0 3 1,16 * *'   # 1st & 16th of every month, 03:00 UTC (08:00 PKT)
  workflow_dispatch: {}       # manual run button in GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/scraper/scrape.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/scraper/state.json
          git diff --cached --quiet || git commit -m "chore: scraper state $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
